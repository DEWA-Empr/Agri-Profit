name: CI

# Validation runs on every pull request and on main. There is no deployment job
# here on purpose: this repository builds and verifies, and a departmental
# deployment is a deliberate act performed against docs/DEPLOYMENT.md, not
# something that happens because a branch moved. See that document for the
# release procedure and the rollback step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
        run: python -m pytest backend/tests/ -v

      - name: Coverage
        env:
          DATABASE_URL: sqlite:///./test.db
        run: python -m pytest backend/tests/ -q --cov=backend/app --cov-report=term

  migrations:
    name: Migration chain (PostgreSQL)
    runs-on: ubuntu-latest

    # The rest of the suite builds its schema with Base.metadata.create_all,
    # which is blind to Alembic — so without this job a broken migration keeps
    # CI green and fails on the next deployment instead. It runs against real
    # PostgreSQL because the chain uses ALTER-constraint operations that SQLite
    # does not support; that is a property of the migrations, not a gap in them.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agriprofit_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify the chain runs, matches the models, and rolls back
        env:
          # A throwaway database created by the service above. The fixture drops
          # and recreates the schema around every test.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agriprofit_migrations
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agriprofit_migrations
        run: python -m pytest backend/tests/test_migrations.py -v

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The security boundaries are asserted by tests rather than by a scanner,
      # because a scanner cannot tell whether a 403 is the RIGHT 403. These are
      # already covered by the backend job; running them again on their own means
      # a failure here names the boundary that broke instead of being one line in
      # a 360-test log.
      - name: Authorization, token handling and input bounds
        env:
          DATABASE_URL: sqlite:///./test.db
        run: |
          python -m pytest -v \
            backend/tests/test_authorization.py \
            backend/tests/test_logging_safety.py \
            backend/tests/test_rate_limit.py \
            backend/tests/test_share_lifecycle.py \
            backend/tests/test_input_validation.py

      - name: Known vulnerabilities in dependencies
        # Advisory: it reports against the installed set and is allowed to fail
        # the step without failing the run, because a new advisory published
        # overnight should raise a flag, not block an unrelated pull request.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt --strict || true

      - name: No secrets committed
        # A narrow, high-signal check: the two shapes this repository could
        # plausibly leak. Not a general scanner — one of those belongs in the
        # organisation's tooling, not in a project CI file where it would mostly
        # produce noise.
        run: |
          set -e
          if git ls-files -z | xargs -0 grep -lE '^\s*SECRET_KEY\s*=\s*["'"'"'][^"'"'"']{16,}' -- 2>/dev/null | grep -v '.env.example'; then
            echo "::error::A SECRET_KEY literal appears to be committed."
            exit 1
          fi
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Secrets must come from the environment."
            exit 1
          fi
          echo "No committed secrets found."

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-latest

    # The production compose file is the deployment. Nothing else in this
    # workflow reads it, so a change that makes `up -d` refuse to start was
    # invisible here until somebody tried to deploy — which is the worst moment
    # to find out. These checks are cheap and need no images built.
    steps:
      - uses: actions/checkout@v4

      - name: The documented deploy command renders with only .env.example set
        # REGRESSION GUARD. Compose interpolates EVERY service in the file, even
        # ones behind a profile that is not selected. A `${VAR:?...}` on the
        # optional `caddy` service therefore broke the ordinary deployment
        # command for every department that terminates TLS elsewhere — which
        # docs/DEPLOYMENT.md says most of them do. Rendering the file with no
        # profile selected catches that class of mistake.
        run: |
          set -e
          # The values a real deployment supplies, and nothing more. If a
          # service outside the `edge` profile grows a new required variable,
          # this fails until .env.example documents it too.
          cat > .env <<'ENV'
          ENVIRONMENT=production
          SECRET_KEY=ci-placeholder-not-a-real-key
          DATABASE_URL=postgresql://agriprofit:placeholder@db:5432/agriprofit
          POSTGRES_USER=agriprofit
          POSTGRES_PASSWORD=placeholder
          POSTGRES_DB=agriprofit
          CORS_ORIGINS=["https://agriprofit.example.edu"]
          ENV
          docker compose -f docker-compose.prod.yml config --quiet
          echo "Production compose renders without the edge profile."

      - name: The optional TLS edge still renders when it is selected
        run: |
          set -e
          CADDY_DOMAIN=agriprofit.example.edu \
            docker compose -f docker-compose.prod.yml --profile edge config --quiet
          echo "Edge profile renders."

      - name: The database publishes no host port in production
        # Publishing 5432 is how a development convenience becomes an
        # internet-facing Postgres; the prod file deliberately omits it.
        run: |
          set -e
          if docker compose -f docker-compose.prod.yml config \
               | python3 -c "import sys,yaml; d=yaml.safe_load(sys.stdin); sys.exit(0 if d['services']['db'].get('ports') else 1)"; then
            echo "::error::docker-compose.prod.yml publishes a host port for the database."
            exit 1
          fi
          echo "Database is reachable on the compose network only."

      - name: The ops scripts are valid shell
        run: |
          set -e
          sh -n ops/backup.sh
          sh -n ops/restore.sh
          echo "ops/backup.sh and ops/restore.sh parse."
