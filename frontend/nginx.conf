# Static serving for the PWA.
#
# Three things here are load-bearing rather than boilerplate:
#
#   1. The SPA fallback. React Router owns the routes, so a deep link like
#      /records must return index.html rather than 404 — otherwise the app works
#      until somebody refreshes the page or opens a bookmark.
#   2. The service worker must NOT be cached. sw.js is how a new deployment
#      reaches an installed app; if a stale one is cached the client can be
#      pinned to an old build indefinitely, which for an offline-first PWA is
#      the worst kind of bug to debug.
#   3. Hashed assets, by contrast, are immutable and cached for a year — that is
#      the whole point of the content hash in the filename.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression matters more here than usual: the target user is on a 3G link.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Defence-in-depth headers. The real controls are server-side, but these are
    # free and close off whole classes of browser-side mistake.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never cache the service worker or the manifest: they are how an installed
    # client learns a new build exists.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        expires off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # Content-hashed build output is immutable by construction.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA fallback — must come last.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
