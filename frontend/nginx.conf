# Static serving for the PWA, and the API proxy in front of the backend.
#
# THE TOPOLOGY THIS FILE OWNS:
#
#   /api/*  ->  backend:8000   (path preserved, including the /api prefix)
#   /*      ->  this container's static build, with an SPA fallback
#
# The proxy half was missing entirely, and its absence was invisible: the
# frontend is built with VITE_API_URL=/api/v1 (same origin), the backend
# publishes no host port, and `location /` ends in try_files ... /index.html.
# So every API call fell through to the SPA fallback and came back as 200
# text/html instead of JSON. The stack reported healthy, the login screen
# rendered, and nothing worked. That is the deployment pattern
# docs/DEPLOYMENT.md calls "your institution proxies to 127.0.0.1:8080".
#
# Four things here are load-bearing rather than boilerplate:
#
#   1. The SPA fallback. React Router owns the routes, so a deep link like
#      /records must return index.html rather than 404 — otherwise the app works
#      until somebody refreshes the page or opens a bookmark.
#   2. The service worker must NOT be cached. sw.js is how a new deployment
#      reaches an installed app; if a stale one is cached the client can be
#      pinned to an old build indefinitely, which for an offline-first PWA is
#      the worst kind of bug to debug.
#   3. Hashed assets, by contrast, are immutable and cached for a year — that is
#      the whole point of the content hash in the filename.
#   4. The /api location must come BEFORE the SPA fallback and must not be
#      swallowed by it. nginx prefix locations are longest-match, so /api/
#      wins over / regardless of order, but the ordering is kept explicit
#      because the failure mode when it does not win is a silent 200 of HTML.

# --- Credential-safe access logging --------------------------------------
# THE PROXY MUST NOT LOG THE SHARE TOKEN EITHER. The backend already scrubs its
# own request log and uvicorn's access log, but adding the /api proxy below put
# a THIRD logger in front of both, and nginx's default access log writes
# $request verbatim:
#
#   "GET /api/v1/share/report/DbHP0i-pCW78tKQ90AKRmAy-XhdmowqGq0Mbuz0VN-c" 200
#
# The token is the entire credential for a farm's finances, so that line is a
# working investor link sitting in the frontend container's stdout. Caught by
# grepping the running stack's logs for a freshly minted token, not by reading
# the config.
#
# Two shapes carry a token in the URL: the API path the report is fetched from,
# and the SPA route the investor opens in the browser. Both are rewritten for
# LOGGING ONLY — $request_uri itself is untouched, so proxying and routing are
# unaffected.
#
# No fingerprint here, unlike the backend's scrubber: nginx has no hashing
# primitive, and the backend already logs a stable fingerprint for the same
# request, so correlation is preserved at the layer that can do it properly.
map $request_uri $safe_request_uri {
    ~^/api/v1/share/report/[^/?]+(?<api_tail>.*)$  "/api/v1/share/report/[redacted]$api_tail";
    ~^/investor/[^/?]+(?<spa_tail>.*)$             "/investor/[redacted]$spa_tail";
    default                                        $request_uri;
}

# The combined format, with the scrubbed target substituted for $request.
log_format safe '$remote_addr - $remote_user [$time_local] '
                '"$request_method $safe_request_uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    access_log /var/log/nginx/access.log safe;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression matters more here than usual: the target user is on a 3G link.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Defence-in-depth headers. The real controls are server-side, but these are
    # free and close off whole classes of browser-side mistake.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never cache the service worker or the manifest: they are how an installed
    # client learns a new build exists.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        expires off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # Content-hashed build output is immutable by construction.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # --- API proxy -------------------------------------------------------
    # Everything under /api goes to the backend with its path INTACT: the
    # backend mounts its routes under /api/v1, so stripping the prefix here
    # would turn every call into a 404 (that is exactly the bug the Caddy edge
    # had, with handle_path).
    location /api/ {
        # Docker's embedded DNS, consulted per request rather than once at
        # startup. With a literal `proxy_pass http://backend:8000` nginx
        # resolves the name when the config loads and caches it forever, so
        # `docker compose up -d --build backend` — which DEPLOYMENT.md documents
        # for a backend-only redeploy — gives the backend a new IP and leaves
        # this container proxying to an address nothing answers on, until
        # somebody thinks to restart the frontend too.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_backend backend;
        # $request_uri, because proxy_pass with a variable does not pass the
        # URI on automatically. It carries the full original path AND the query
        # string, so /api/v1/ledger/logs?skip=0 arrives unchanged.
        proxy_pass http://$api_backend:8000$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITTEN, never appended. The backend reads the first entry of this
        # header to identify a caller for per-IP rate limiting, so appending to
        # whatever the client sent ($proxy_add_x_forwarded_for) would let anyone
        # choose their own rate-limit bucket by sending the header themselves.
        # Overwriting is what makes TRUST_PROXY_HEADERS safe to enable at all.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The DSS trains its model on first boot, so the first request after a
        # cold start can wait a while; the default 60s read timeout would turn
        # that into a 504.
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # --- Operational probes ----------------------------------------------
    # The backend mounts /health (liveness) and /health/ready (readiness) at the
    # APPLICATION ROOT, not under /api, so the /api location above does not
    # carry them. Without these two exact-match locations both fall through to
    # the SPA fallback and answer 200 text/html — which is how the readiness
    # command in DEPLOYMENT.md came to "pass" while proving nothing at all.
    #
    # Exact match (`location =`) so nothing else under /health is proxied, and
    # so an SPA route named /healthcheck would still reach the app.
    location = /health {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $health_backend backend;
        proxy_pass http://$health_backend:8000$request_uri;
        proxy_set_header Host $host;
        access_log off;          # a probe every 30s is noise, not diagnostics
    }

    location = /health/ready {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $ready_backend backend;
        proxy_pass http://$ready_backend:8000$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA fallback — must come last.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
