services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agriprofit
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agriprofit
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Production build of the PWA served by `vite preview`, so the service worker
  # (and its offline-read runtime caching, ticket 06) is actually active — the
  # dev `frontend` above runs no worker. Behind the "prod" profile so it does not
  # start by default or collide with the dev server:
  #   docker compose --profile prod up -d --build frontend-prod
  # Served on http://localhost:4173 (that origin is in the backend CORS list).
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "4173:4173"
    depends_on:
      - backend
    profiles:
      - prod

volumes:
  postgres_data:
